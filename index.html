<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="theme-color" content="#0f1923" />
        <title>Apnea Dry Training</title>
        <script>
            (function () {
                var voice =
                    localStorage.getItem("apnea_voice_gender") === "male"
                        ? "male"
                        : "female";
                ["count_321", "count_54321", "breathe", "hold"].forEach(
                    function (key) {
                        var l = document.createElement("link");
                        l.rel = "preload";
                        l.as = "audio";
                        l.href = "audio/" + voice + "/" + key + ".opus";
                        l.type = "audio/webm";
                        document.head.appendChild(l);
                    },
                );
            })();
        </script>
        <script>
            (function () {
                var v = new URLSearchParams(location.search).get("v");
                var q = v ? "?v=" + v : "";
                var link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = "style.css" + q;
                document.head.appendChild(link);
            })();
        </script>
    </head>
    <body>
        <div id="app">
            <header id="header">
                <button id="btn-back" class="btn-icon">
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </button>
                <h1 id="header-title">Tables</h1>
                <button
                    id="btn-sound"
                    class="btn-icon"
                    title="Toggle sound"
                ></button>
                <button id="btn-history" class="btn-icon" title="History">
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                </button>
                <button id="btn-settings" class="btn-icon" title="Settings">
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                        />
                    </svg>
                </button>
            </header>
            <main id="main"></main>
        </div>
        <script>
            (function () {
                var v = new URLSearchParams(location.search).get("v");
                var s = document.createElement("script");
                s.src = "app.js" + (v ? "?v=" + v : "");
                document.body.appendChild(s);
            })();
        </script>
    </body>
</html>
